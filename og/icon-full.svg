<!-- Source for public/apple-touch-icon.png and public/icon-maskable-512.png
     (`npm run icons`). The favicon drawn full-bleed: iOS and Android apply
     their own corner mask, so no radius here, and the mark stays inside the
     middle four fifths. -->
