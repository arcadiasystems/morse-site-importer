  <g transform="translate(21 18.76) scale(0.58)">
    <path d="M8 60 V18 H36 V60 H64 V18 H92 V60" fill="none" stroke="#F4F2EC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="8" y="80" width="24" height="14" rx="7" fill="#FFE62E"/>
    <rect x="38" y="80" width="24" height="14" rx="7" fill="#FFE62E"/>
    <rect x="68" y="80" width="24" height="14" rx="7" fill="#FFE62E"/>
  </g>
</svg>
