name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node is pinned because package.json declares no engines.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      # The build script is "tsc -b && vite build", so this is also the
      # typecheck; there is no separate typecheck script.
      - name: Build
        run: npm run build
      # The script the page shows, run twice against a stand-in CLI that sends
      # nothing: one entry per file, then no duplicates. Needs bash and jq,
      # which the runner has.
      - name: Recipe check
        run: npm run check:recipe

  # The one check the ruleset on main requires. It runs on every pull request,
  # even when a job above fails or is cancelled, so the required status always
  # reports instead of sitting at "expected".
  ci-ok:
    name: ci-ok
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
